name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: node pi/tools/typecheck.mjs
      - run: node pi/tests/run-all.mjs
      - run: node scripts/scan-public-tree.mjs
      - run: node scripts/check-docs.mjs
